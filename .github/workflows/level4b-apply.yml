name: Level4B Apply

on:
  push:
    branches: [feature/level-4b-high-scale-design]
    paths:
      - scripts/level4b-apply.py
      - .github/workflows/level4b-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[level4b-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/level-4b-high-scale-design
          fetch-depth: 0
      - name: Apply integration migration
        run: python scripts/level4b-apply.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/optimizer/src/level4-path-engine.ts packages/optimizer/src/level4-design.ts packages/optimizer/src/index.ts
          git diff --cached --exit-code && exit 0
          git commit -m "feat(level4b): integrate compiled path engine [level4b-applied]"
          git push origin HEAD:feature/level-4b-high-scale-design
