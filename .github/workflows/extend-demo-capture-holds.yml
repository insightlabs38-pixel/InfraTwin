name: Extend demo capture holds

on:
  push:
    branches:
      - demo-winning-level-capture

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add validation margin to final-state holds
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('e2e/demo/demo-scenes.spec.ts')
          text = path.read_text()
          replacements = [
              (
                  "await pauseForViewer(5_000);\n  await capture.finish({ verdict: analysis.verdict });",
                  "await pauseForViewer(5_750);\n  await capture.finish({ verdict: analysis.verdict });",
              ),
              (
                  "await pauseForViewer(4_800);\n  await capture.finish({ lockedLinkId: proposalLinkId });",
                  "await pauseForViewer(5_550);\n  await capture.finish({ lockedLinkId: proposalLinkId });",
              ),
              (
                  "await pauseForViewer(5_000);\n  await capture.finish({ staleProposalTarget: proposalLinkId });",
                  "await pauseForViewer(6_000);\n  await capture.finish({ staleProposalTarget: proposalLinkId });",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one timing target, found {text.count(old)}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          node --experimental-strip-types --check e2e/demo/demo-scenes.spec.ts
          git diff --check
      - name: Commit timing repair and remove this temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/extend-demo-capture-holds.yml
          git add e2e/demo/demo-scenes.spec.ts
          git commit -m 'test: add capture-duration margin'
          git push origin HEAD:${GITHUB_REF_NAME}
