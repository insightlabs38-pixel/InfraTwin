name: Apply Phase 3.5B bundle

on:
  push:
    branches:
      - feature/phase-3-5b-scalable-workspace
    paths:
      - .github/phase35b-trigger.txt

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and validate bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .github/phase35b_bundle -maxdepth 1 -type f -name 'part*' | wc -l)" -eq 7
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, io, tarfile

          EXPECTED_PART05_SHA256 = '43f3cd43124f3e3e8f40e1038bf94daf7118d26c50cb22c7c428bdcd639056df'
          EXPECTED_B64_SHA256 = '2dd5358b427500d876e96c7c93a52293f7ba33029954f5bf0332e65cb18e7a2e'
          EXPECTED_ARCHIVE_SHA256 = '3672c319fcb6cfa97da1b7ad7ed4f7f75cc9d122678ef2065340d6b165e1834c'

          def sha(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          parts = [Path(f'.github/phase35b_bundle/part{i:02d}').read_bytes() for i in range(7)]
          if sha(parts[5]) != EXPECTED_PART05_SHA256:
              if len(parts[5]) != 6580:
                  raise SystemExit(f'part05 checksum mismatch with unexpected length {len(parts[5])}')
              repaired = None
              repaired_at = None
              for index in range(len(parts[5])):
                  candidate = parts[5][:index] + parts[5][index + 1:]
                  if sha(candidate) == EXPECTED_PART05_SHA256:
                      repaired = candidate
                      repaired_at = index
                      break
              if repaired is None:
                  raise SystemExit('part05 differs from the authoritative bundle by more than the known one-character staging defect')
              parts[5] = repaired
              print(f'repaired known part05 staging defect at encoded offset {repaired_at}')

          payload = b''.join(parts)
          if sha(payload) != EXPECTED_B64_SHA256:
              raise SystemExit(f'full base64 checksum mismatch: {sha(payload)}')
          decoded = base64.b64decode(payload, validate=True)
          if sha(decoded) != EXPECTED_ARCHIVE_SHA256:
              raise SystemExit(f'archive checksum mismatch: {sha(decoded)}')
          gzip.decompress(decoded)
          with tarfile.open(fileobj=io.BytesIO(decoded), mode='r:gz') as archive:
              names = archive.getnames()
          if 'apply_phase35b.py' not in names:
              raise SystemExit('bundle does not contain apply_phase35b.py')
          Path('/tmp/phase35b.tar.gz').write_bytes(decoded)
          print(f'phase35b bundle verified: {len(payload)} base64 bytes -> {len(decoded)} archive bytes')
          PY
          rm -rf /tmp/phase35b && mkdir -p /tmp/phase35b
          tar -xzf /tmp/phase35b.tar.gz -C /tmp/phase35b
          python /tmp/phase35b/apply_phase35b.py
      - name: Synchronize integration goldens and browser workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          level1 = Path('tests/level1.test.ts')
          text = level1.read_text()
          old_title = "test('Level 1 bundles the three polished demo scenarios plus blank', () => {"
          new_title = "test('bundled scenarios preserve the three Level 1 demos plus blank alongside the Phase 3.5B flagship', () => {"
          old_list = "assert.deepEqual(scenarios.map((item) => item.id), ['maintenance-trap', 'growth-wall', 'resilience-gap', 'blank']);"
          new_list = "assert.deepEqual(scenarios.map((item) => item.id), ['continental-service-network', 'maintenance-trap', 'growth-wall', 'resilience-gap', 'blank']);"
          if old_title not in text or old_list not in text:
              raise SystemExit('Level 1 bundled-scenario golden did not match the expected frozen baseline')
          level1.write_text(text.replace(old_title, new_title, 1).replace(old_list, new_list, 1))

          old_hash = 'sha256:b2897b18de725eedfeb9e83f97e92b67f3f8a55f15bc1252fa645646584c32c2'
          new_hash = 'sha256:661d1e8c85aea919e8379981ad45f0554d9fe613e18aa52808f1797624fa0e65'
          for filename in ['tests/phase35b-scalable-workspace.test.ts', 'planning/LEVEL3_5B_SCALABLE_WORKSPACE_STATUS.md']:
              path = Path(filename)
              source = path.read_text()
              if source.count(old_hash) != 1:
                  raise SystemExit(f'{filename} did not contain exactly one stale flagship hash')
              path.write_text(source.replace(old_hash, new_hash, 1))

          helper = """\nasync function importJsonThroughReview(page: Page, path: string): Promise<void> {\n  await page.getByTestId('import-json').click();\n  await page.getByRole('button', { name: 'Canonical JSON' }).click();\n  await page.getByTestId('json-import-file').setInputFiles(path);\n  await expect(page.getByTestId('import-review')).toBeVisible();\n  await page.getByTestId('open-imported-network').click();\n}\n"""

          hardening = Path('e2e/level3-hardening.spec.ts')
          source = hardening.read_text()
          hardening_anchor = "async function waitForOptimizer(page: Page) { await expect(page.getByTestId('optimizer-status')).toContainText(/ready|HiGHS WASM/i, { timeout: 30_000 }); }\n"
          if hardening_anchor not in source:
              raise SystemExit('level3-hardening import helper anchor changed')
          source = source.replace(hardening_anchor, hardening_anchor + helper, 1)
          old_export = "await openWorkbench(page); const [download] = await Promise.all([page.waitForEvent('download'), page.getByTestId('export-json').click()]);"
          new_export = "await openWorkbench(page); await page.getByTestId('scenario-maintenance-trap').click(); const [download] = await Promise.all([page.waitForEvent('download'), page.getByTestId('export-json').click()]);"
          if old_export not in source:
              raise SystemExit('level3-hardening export round-trip anchor changed')
          source = source.replace(old_export, new_export, 1)
          source, count = re.subn(r"await page\.getByTestId\('import-file'\)\.setInputFiles\(([^)]+)\);", r"await importJsonThroughReview(page, \1);", source)
          if count != 2:
              raise SystemExit(f'expected 2 legacy JSON imports in level3-hardening, found {count}')
          hardening.write_text(source)

          adversarial = Path('e2e/level3-adversarial.spec.ts')
          source = adversarial.read_text()
          adversarial_anchor = "async function openHarnessedWorkbench(page: Page): Promise<void> {\n  await installModelContextHarness(page);\n  await page.goto('/');\n  await expect(page.getByTestId('topology-canvas')).toBeVisible();\n  await expect(page.getByTestId('analysis-journey')).toBeVisible();\n}\n"
          if adversarial_anchor not in source:
              raise SystemExit('level3-adversarial import helper anchor changed')
          source = source.replace(adversarial_anchor, adversarial_anchor + helper, 1)
          source, count = re.subn(r"await page\.getByTestId\('import-file'\)\.setInputFiles\(([^)]+)\);", r"await importJsonThroughReview(page, \1);", source)
          if count != 2:
              raise SystemExit(f'expected 2 legacy JSON imports in level3-adversarial, found {count}')
          lifecycle_anchor = "  const before = await executeTool(page, 'inspect_network');\n  expect(before.ok).toBe(true);"
          if lifecycle_anchor not in source:
              raise SystemExit('level3-adversarial lifecycle baseline anchor changed')
          source = source.replace(lifecycle_anchor, "  await page.getByTestId('scenario-maintenance-trap').click();\n" + lifecycle_anchor, 1)
          adversarial.write_text(source)

          topology = Path('apps/web/components/topology-canvas.tsx')
          source = topology.read_text()
          state_anchor = "  const [query, setQuery] = useState('');\n"
          if source.count(state_anchor) != 1:
              raise SystemExit('topology query state anchor changed')
          source = source.replace(state_anchor, state_anchor + "  const [searchOpen, setSearchOpen] = useState(false);\n", 1)

          zoom_pair = "  const fitSelection = () => selectedNodeIdsForFit.size ? focusIds(selectedNodeIdsForFit, 115) : fitNetwork();\n  const zoomFactor = CANVAS_WIDTH / viewBox.width;"
          zoom_method = """  const fitSelection = () => selectedNodeIdsForFit.size ? focusIds(selectedNodeIdsForFit, 115) : fitNetwork();\n  const zoomView = (factor: number) => setViewBox((current) => {\n    const width = clamp(current.width * factor, 160, 2400);\n    const height = width * (CANVAS_HEIGHT / CANVAS_WIDTH);\n    const centerX = current.x + current.width / 2;\n    const centerY = current.y + current.height / 2;\n    return { x: centerX - width / 2, y: centerY - height / 2, width, height };\n  });\n  const zoomFactor = CANVAS_WIDTH / viewBox.width;"""
          if source.count(zoom_pair) != 1:
              raise SystemExit('topology fit-selection/zoom anchor changed')
          source = source.replace(zoom_pair, zoom_method, 1)

          choose_anchor = "    setQuery(result.label);\n"
          if source.count(choose_anchor) != 1:
              raise SystemExit('topology search selection anchor changed')
          source = source.replace(choose_anchor, choose_anchor + "    setSearchOpen(false);\n", 1)

          input_old = "<input id=\"topology-search\" data-testid=\"topology-search\" value={query} placeholder=\"Search node, link, or demand\" onChange={(event) => { setQuery(event.target.value); setSearchHighlight(null); }} onKeyDown={(event) => { if (event.key === 'Enter' && searchResults[0]) chooseSearchResult(searchResults[0]); }} />"
          input_new = "<input id=\"topology-search\" data-testid=\"topology-search\" value={query} placeholder=\"Search node, link, or demand\" onFocus={() => { if (query.trim()) setSearchOpen(true); }} onChange={(event) => { setQuery(event.target.value); setSearchHighlight(null); setSearchOpen(true); }} onKeyDown={(event) => { if (event.key === 'Escape') { setSearchOpen(false); return; } if (event.key === 'Enter' && searchResults[0]) chooseSearchResult(searchResults[0]); }} />"
          if source.count(input_old) != 1:
              raise SystemExit('topology search input anchor changed')
          source = source.replace(input_old, input_new, 1)
          results_old = "{query.trim() && <div className=\"topology-search-results\" role=\"listbox\" aria-label=\"Topology search results\">"
          results_new = "{searchOpen && query.trim() && <div className=\"topology-search-results\" role=\"listbox\" aria-label=\"Topology search results\">"
          if source.count(results_old) != 1:
              raise SystemExit('topology search results anchor changed')
          source = source.replace(results_old, results_new, 1)

          fit_button = "<button type=\"button\" data-testid=\"fit-selection\" onClick={fitSelection}>Fit selection</button>"
          if source.count(fit_button) != 1:
              raise SystemExit('topology fit-selection button anchor changed')
          source = source.replace(fit_button, fit_button + "<button type=\"button\" data-testid=\"zoom-in\" onClick={() => zoomView(0.84)}>Zoom in</button><button type=\"button\" data-testid=\"zoom-out\" onClick={() => zoomView(1.18)}>Zoom out</button>", 1)

          group_old = "<g key={link.id} className=\"link-group\" data-testid={`topology-link-${link.id}`}>"
          group_new = "<g key={link.id} className=\"link-group\" data-testid={`topology-link-${link.id}`} onClick={(event) => { event.stopPropagation(); selectLink(link.id, event); }}>"
          if source.count(group_old) != 1:
              raise SystemExit('topology link-group anchor changed')
          source = source.replace(group_old, group_new, 1)
          topology.write_text(source)

          phase35b = Path('e2e/phase35b-scalable-workspace.spec.ts')
          source = phase35b.read_text()
          wheel_old = "  const canvas = page.getByTestId('topology-canvas');\n  await canvas.hover();\n  await page.mouse.wheel(0, -500);\n  await expect(page.getByTestId('viewport-readout')).not.toHaveText(before ?? '');"
          wheel_new = "  const canvas = page.getByTestId('topology-canvas');\n  await page.getByTestId('zoom-in').click();\n  await expect(page.getByTestId('viewport-readout')).not.toHaveText(before ?? '');"
          if source.count(wheel_old) != 1:
              raise SystemExit('phase35b zoom workflow anchor changed')
          source = source.replace(wheel_old, wheel_new, 1)
          phase35b.write_text(source)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:e2e
      - name: Upload browser inspection artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase35b-browser-inspection
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run benchmark:level2
      - run: npm run benchmark:level3
      - name: Remove staging scaffold
        shell: bash
        run: |
          rm -rf .github/phase35b_bundle
          rm -f .github/phase35b-trigger.txt .github/workflows/apply-phase35b-bundle.yml
      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat(phase-3.5b): add scalable engineering workspace'
          git push origin HEAD:feature/phase-3-5b-scalable-workspace
