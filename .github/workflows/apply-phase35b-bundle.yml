name: Apply Phase 3.5B bundle

on:
  push:
    branches:
      - feature/phase-3-5b-scalable-workspace
    paths:
      - .github/phase35b-trigger.txt

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and validate bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .github/phase35b_bundle -maxdepth 1 -type f -name 'part*' | wc -l)" -eq 7
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, io, tarfile

          EXPECTED_PART05_SHA256 = '43f3cd43124f3e3e8f40e1038bf94daf7118d26c50cb22c7c428bdcd639056df'
          EXPECTED_B64_SHA256 = '2dd5358b427500d876e96c7c93a52293f7ba33029954f5bf0332e65cb18e7a2e'
          EXPECTED_ARCHIVE_SHA256 = '3672c319fcb6cfa97da1b7ad7ed4f7f75cc9d122678ef2065340d6b165e1834c'

          def sha(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          parts = [Path(f'.github/phase35b_bundle/part{i:02d}').read_bytes() for i in range(7)]
          if sha(parts[5]) != EXPECTED_PART05_SHA256:
              if len(parts[5]) != 6580:
                  raise SystemExit(f'part05 checksum mismatch with unexpected length {len(parts[5])}')
              repaired = None
              repaired_at = None
              for index in range(len(parts[5])):
                  candidate = parts[5][:index] + parts[5][index + 1:]
                  if sha(candidate) == EXPECTED_PART05_SHA256:
                      repaired = candidate
                      repaired_at = index
                      break
              if repaired is None:
                  raise SystemExit('part05 differs from the authoritative bundle by more than the known one-character staging defect')
              parts[5] = repaired
              print(f'repaired known part05 staging defect at encoded offset {repaired_at}')

          payload = b''.join(parts)
          if sha(payload) != EXPECTED_B64_SHA256:
              raise SystemExit(f'full base64 checksum mismatch: {sha(payload)}')
          decoded = base64.b64decode(payload, validate=True)
          if sha(decoded) != EXPECTED_ARCHIVE_SHA256:
              raise SystemExit(f'archive checksum mismatch: {sha(decoded)}')
          gzip.decompress(decoded)
          with tarfile.open(fileobj=io.BytesIO(decoded), mode='r:gz') as archive:
              names = archive.getnames()
          if 'apply_phase35b.py' not in names:
              raise SystemExit('bundle does not contain apply_phase35b.py')
          Path('/tmp/phase35b.tar.gz').write_bytes(decoded)
          print(f'phase35b bundle verified: {len(payload)} base64 bytes -> {len(decoded)} archive bytes')
          PY
          rm -rf /tmp/phase35b && mkdir -p /tmp/phase35b
          tar -xzf /tmp/phase35b.tar.gz -C /tmp/phase35b
          (cd /tmp/phase35b && python apply_phase35b.py)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:e2e
      - name: Upload browser inspection artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase35b-browser-inspection
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run benchmark:level2
      - run: npm run benchmark:level3
      - name: Remove staging scaffold
        shell: bash
        run: |
          rm -rf .github/phase35b_bundle
          rm -f .github/phase35b-trigger.txt .github/workflows/apply-phase35b-bundle.yml
      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat(phase-3.5b): add scalable engineering workspace'
          git push origin HEAD:feature/phase-3-5b-scalable-workspace
