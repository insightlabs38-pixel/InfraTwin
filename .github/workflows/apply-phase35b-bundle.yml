name: Apply Phase 3.5B bundle

on:
  push:
    branches:
      - feature/phase-3-5b-scalable-workspace
    paths:
      - .github/phase35b-trigger.txt

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and validate bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .github/phase35b_bundle -maxdepth 1 -type f -name 'part*' | wc -l)" -eq 7
          python - <<'PY'
          from pathlib import Path
          import base64, re
          parts = [Path(f'.github/phase35b_bundle/part{i:02d}').read_bytes() for i in range(7)]
          raw = b''.join(parts)
          clean = re.sub(rb'[^A-Za-z0-9+/=]', b'', raw)
          print(f'phase35b bundle bytes: raw={len(raw)} clean={len(clean)} removed={len(raw)-len(clean)} remainder={len(clean)%4}')
          if len(clean) % 4 == 1:
              raise SystemExit('base64 payload has impossible length (mod 4 == 1); encoded data is missing or has an extra alphabet character')
          clean += b'=' * ((-len(clean)) % 4)
          try:
              decoded = base64.b64decode(clean, validate=True)
          except Exception as exc:
              raise SystemExit(f'base64 validation failed: {exc}')
          Path('/tmp/phase35b.tar.gz').write_bytes(decoded)
          print(f'phase35b archive bytes: {len(decoded)}')
          PY
          gzip -t /tmp/phase35b.tar.gz
          rm -rf /tmp/phase35b && mkdir -p /tmp/phase35b
          tar -xzf /tmp/phase35b.tar.gz -C /tmp/phase35b
          test -f /tmp/phase35b/apply_phase35b.py
          (cd /tmp/phase35b && python apply_phase35b.py)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:e2e
      - name: Upload browser inspection artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase35b-browser-inspection
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run benchmark:level2
      - run: npm run benchmark:level3
      - name: Remove staging scaffold
        shell: bash
        run: |
          rm -rf .github/phase35b_bundle
          rm -f .github/phase35b-trigger.txt .github/workflows/apply-phase35b-bundle.yml
      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat(phase-3.5b): add scalable engineering workspace'
          git push origin HEAD:feature/phase-3-5b-scalable-workspace
