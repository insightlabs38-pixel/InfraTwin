name: Apply current violation visibility guard

on:
  push:
    branches:
      - ui-winning-level-hardening

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-winning-level-hardening
          fetch-depth: 0
      - name: Hide non-current topology violations
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/web/components/workbench-m35d-stage2.tsx')
          text = path.read_text(encoding='utf-8')
          old = "  const violationLinkIds = useMemo(() => new Set(analysis.result.violations.map((item:any) => item.linkId).filter((id:any): id is string => Boolean(id))), [analysis.result.violations]);"
          new = "  const violationLinkIds = useMemo(() => new Set((Boolean(ephemeralPatch) || (analysisAuthoritative && analysisFresh) ? analysis.result.violations : []).map((item:any) => item.linkId).filter((id:any): id is string => Boolean(id))), [analysis.result.violations, analysisAuthoritative, analysisFresh, ephemeralPatch]);"
          if old in text:
              assert text.count(old) == 1
              text = text.replace(old, new, 1)
          else:
              assert new in text
          path.write_text(text, encoding='utf-8')
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/fix-current-violation-overlay.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/workbench-m35d-stage2.tsx .github/workflows/fix-current-violation-overlay.yml
          git commit -m "fix: hide stale topology violations"
          git push origin HEAD:ui-winning-level-hardening
