name: Apply Level 3 source

on:
  push:
    branches:
      - feature/level-3-optimization

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose remaining Level 3 transport tail
        shell: bash
        run: |
          set -euo pipefail
          cat .github/level3_bundle_v2/part{00..05} \
              .github/level3_bundle/part02 \
              .github/level3_bundle/part03 > /tmp/level3.b64

          echo 'candidate:'
          wc -c /tmp/level3.b64
          sha256sum /tmp/level3.b64

          echo 'v1 part02 4k chunks:'
          split -b 4000 -d -a 2 .github/level3_bundle/part02 /tmp/p2-
          sha256sum /tmp/p2-*
          echo 'v2 part06:'
          sha256sum .github/level3_bundle_v2/part06
          cmp -s /tmp/p2-00 .github/level3_bundle_v2/part06 && echo 'part02 chunk0 matches verified v2 part06' || echo 'part02 chunk0 differs from verified v2 part06'

          echo 'v1 part03 chunks:'
          split -b 4000 -d -a 2 .github/level3_bundle/part03 /tmp/p3-
          wc -c /tmp/p3-*
          sha256sum /tmp/p3-*

          echo 'decoded candidate:'
          base64 --decode /tmp/level3.b64 > /tmp/level3.tar.gz
          wc -c /tmp/level3.tar.gz
          sha256sum /tmp/level3.tar.gz
          if gzip -t /tmp/level3.tar.gz; then
            echo 'gzip integrity OK'
          else
            echo 'gzip integrity FAILED'
          fi
