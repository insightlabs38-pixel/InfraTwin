name: Level 3 reversibility fix and gate

on:
  push:
    branches:
      - feature/level-3-optimization

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact reversibility and strict-test typing fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          model_path = Path('packages/model/src/index.ts')
          text = model_path.read_text()

          old_availability = """    case 'set_link_availability': {\n      const linkId = String(command.args.linkId ?? '');\n      const link = next.links.find((item) => item.id === linkId);\n      if (!link) throw new Error(`Unknown link ${linkId}`);\n      link.available = Boolean(command.args.available);\n      break;\n    }\n"""
          new_availability = """    case 'set_link_availability': {\n      const linkId = String(command.args.linkId ?? '');\n      const link = next.links.find((item) => item.id === linkId);\n      if (!link) throw new Error(`Unknown link ${linkId}`);\n      if (!Object.prototype.hasOwnProperty.call(command.args, 'available')) throw new Error('set_link_availability requires args.available');\n      const available = command.args.available;\n      if (available === null) delete link.available;\n      else if (typeof available === 'boolean') link.available = available;\n      else throw new Error('available must be boolean or null for exact restoration');\n      break;\n    }\n"""
          if old_availability not in text:
              raise SystemExit('expected set_link_availability block not found')
          text = text.replace(old_availability, new_availability, 1)

          old_capacity = """    case 'set_link_capacity': {\n      const linkId = String(command.args.linkId ?? '');\n      const capacityGbps = Number(command.args.capacityGbps);\n      const link = next.links.find((item) => item.id === linkId);\n      if (!link) throw new Error(`Unknown link ${linkId}`);\n      if (!Number.isFinite(capacityGbps) || capacityGbps <= 0) throw new Error('capacityGbps must be > 0');\n      link.capacityGbps = capacityGbps;\n      if (link.upgradeOptions) link.upgradeOptions = link.upgradeOptions.filter((option) => option.capacityGbps > capacityGbps + 1e-9);\n      break;\n    }\n"""
          new_capacity = """    case 'set_link_capacity': {\n      const linkId = String(command.args.linkId ?? '');\n      const capacityGbps = Number(command.args.capacityGbps);\n      const link = next.links.find((item) => item.id === linkId);\n      if (!link) throw new Error(`Unknown link ${linkId}`);\n      if (!Number.isFinite(capacityGbps) || capacityGbps <= 0) throw new Error('capacityGbps must be > 0');\n      link.capacityGbps = capacityGbps;\n      if (Object.prototype.hasOwnProperty.call(command.args, 'upgradeOptions')) {\n        const upgradeOptions = command.args.upgradeOptions;\n        if (upgradeOptions === null) delete link.upgradeOptions;\n        else if (Array.isArray(upgradeOptions)) {\n          link.upgradeOptions = upgradeOptions.map((option) => {\n            if (!isRecord(option) || !finiteNumber(option.capacityGbps) || !finiteNumber(option.cost)) throw new Error('upgradeOptions must contain numeric capacityGbps and cost');\n            return { capacityGbps: option.capacityGbps, cost: option.cost };\n          });\n        } else throw new Error('upgradeOptions must be an array or null for exact restoration');\n      } else if (link.upgradeOptions) {\n        link.upgradeOptions = link.upgradeOptions.filter((option) => option.capacityGbps > capacityGbps + 1e-9);\n      }\n      break;\n    }\n"""
          if old_capacity not in text:
              raise SystemExit('expected set_link_capacity block not found')
          text = text.replace(old_capacity, new_capacity, 1)

          start = text.index('export function invertCandidatePlan(')
          new_inverse = """export function invertCandidatePlan(project: NetworkProject, candidate: CandidatePlan): CandidatePlan {\n  if (candidate.baseModelHash !== modelHash(project)) throw new Error('Candidate is stale because the project changed after it was proposed.');\n  let current = cloneProject(project);\n  const inverseCommands: ModelCommand[] = [];\n\n  candidate.commands.forEach((command, index) => {\n    let inverse: ModelCommand;\n    if (command.type === 'set_link_capacity') {\n      const linkId = String(command.args.linkId ?? '');\n      const link = current.links.find((item) => item.id === linkId);\n      if (!link) throw new Error(`Unknown link ${linkId}`);\n      inverse = {\n        id: `undo-${index}-${command.id}`,\n        type: 'set_link_capacity',\n        actor: 'human',\n        args: {\n          linkId,\n          capacityGbps: link.capacityGbps,\n          upgradeOptions: link.upgradeOptions ? link.upgradeOptions.map((option) => ({ ...option })) : null,\n        },\n        createdAt: new Date(0).toISOString(),\n      };\n    } else if (command.type === 'set_link_availability') {\n      const linkId = String(command.args.linkId ?? '');\n      const link = current.links.find((item) => item.id === linkId);\n      if (!link) throw new Error(`Unknown link ${linkId}`);\n      inverse = {\n        id: `undo-${index}-${command.id}`,\n        type: 'set_link_availability',\n        actor: 'human',\n        args: { linkId, available: Object.prototype.hasOwnProperty.call(link, 'available') ? link.available : null },\n        createdAt: new Date(0).toISOString(),\n      };\n    } else if (command.type === 'set_demand_bandwidth') {\n      const demandId = String(command.args.demandId ?? '');\n      const demand = current.demands.find((item) => item.id === demandId);\n      if (!demand) throw new Error(`Unknown demand ${demandId}`);\n      inverse = {\n        id: `undo-${index}-${command.id}`,\n        type: 'set_demand_bandwidth',\n        actor: 'human',\n        args: { demandId, bandwidthGbps: demand.bandwidthGbps },\n        createdAt: new Date(0).toISOString(),\n      };\n    } else {\n      throw new Error(`Candidate command ${command.type} is not reversibly supported.`);\n    }\n    inverseCommands.unshift(inverse);\n    current = applyModelCommand(current, command);\n  });\n\n  return {\n    id: `undo:${candidate.id}`,\n    name: `Undo ${candidate.name}`,\n    baseModelHash: modelHash(current),\n    commands: inverseCommands,\n    objective: { name: 'undo', value: 0 },\n    rationaleEvidenceIds: [...candidate.rationaleEvidenceIds],\n  };\n}\n"""
          text = text[:start] + new_inverse
          model_path.write_text(text)

          test_path = Path('tests/level3.test.ts')
          tests = test_path.read_text()
          marker = """test('optimizer WebMCP group exposes candidate-only solve, routing LP, and independent verification', async () => {\n"""
          extra = """test('inverse preserves an originally absent optional availability property', () => {\n  const project = loadGrowthWall();\n  const linkId = project.links[0].id;\n  delete project.links[0].available;\n  const candidate: CandidatePlan = {\n    id: 'candidate:availability-round-trip',\n    name: 'Availability round trip',\n    baseModelHash: modelHash(project),\n    commands: [{ id: 'cmd-disable', type: 'set_link_availability', actor: 'agent', args: { linkId, available: false }, createdAt: new Date(0).toISOString() }],\n    objective: { name: 'test', value: 0 },\n    rationaleEvidenceIds: [],\n  };\n  const undo = invertCandidatePlan(project, candidate);\n  const restored = applyCandidatePlan(applyCandidatePlan(project, candidate), undo);\n  assert.equal(modelHash(restored), modelHash(project));\n  assert.equal(Object.prototype.hasOwnProperty.call(restored.links.find((link) => link.id === linkId)!, 'available'), false);\n});\n\n"""
          if marker not in tests:
              raise SystemExit('WebMCP test marker not found')
          tests = tests.replace(marker, extra + marker, 1)
          old_opt = "assert.equal(optimization?.diagnostics.proof, 'optimal');"
          new_opt = "assert.equal((optimization as CapacityOptimizationResult | null)?.diagnostics.proof, 'optimal');"
          old_verify = "assert.equal(verification?.status, 'verified');"
          new_verify = "assert.equal((verification as CandidateVerification | null)?.status, 'verified');"
          if old_opt not in tests or old_verify not in tests:
              raise SystemExit('expected strict-typing assertions not found')
          tests = tests.replace(old_opt, new_opt, 1).replace(old_verify, new_verify, 1)
          test_path.write_text(tests)
          PY
      - name: Sync npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Clean install
        run: npm ci --no-audit --no-fund
      - name: Run deterministic test suite
        run: npm test
      - name: Run Level 3 optimizer benchmark
        run: npm run benchmark:level3
      - name: Strict TypeScript
        run: npm run typecheck
      - name: Production Next build
        run: npm run build
      - name: Commit green Level 3 fix and lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/model/src/index.ts tests/level3.test.ts package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'fix(level-3): make candidate undo byte-exact' -m 'Restore pruned upgrade options and optional link availability state, construct inverse commands from immediate pre-command snapshots, make WebMCP eval assertions strict-TypeScript-safe, and synchronize the HiGHS lockfile after the full Level 3 gate.'
          git push origin HEAD:feature/level-3-optimization
