name: Level 3 lock and gate

on:
  push:
    branches:
      - feature/level-3-optimization

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Clean install
        run: npm ci --no-audit --no-fund
      - name: Run deterministic test suite
        run: npm test
      - name: Run Level 3 optimizer benchmark
        run: npm run benchmark:level3
      - name: Strict TypeScript
        run: npm run typecheck
      - name: Production Next build
        run: npm run build
      - name: Commit synchronized lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(level-3): sync HiGHS lockfile'
          git push origin HEAD:feature/level-3-optimization
