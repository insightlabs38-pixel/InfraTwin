name: Apply current evidence authority guard

on:
  push:
    branches:
      - ui-winning-level-hardening

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-winning-level-hardening
          fetch-depth: 0
      - name: Guard current evidence presentation
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/web/components/workbench-m35d-stage6.tsx')
          text = path.read_text(encoding='utf-8')

          anchor = "  const renderPlanResultSummary=()=> <section data-testid=\"plan-analysis-status\""
          guard = "  const currentAnalysisVisible = Boolean(ephemeralPatch) || (analysisAuthoritative && (authority === 'PASS' || authority === 'FAIL'));\n"
          if guard not in text:
              assert text.count(anchor) == 1, f'expected one render anchor, found {text.count(anchor)}'
              text = text.replace(anchor, guard + anchor, 1)

          replacements = {
              "analysisAuthoritative&&analysis.result.violations.length>0": "currentAnalysisVisible&&analysis.result.violations.length>0",
              "analysisAuthoritative?gbps(analysis.routing.linkLoadsGbps[selectedCanonicalLink.id]??0):'—'": "currentAnalysisVisible?gbps(analysis.routing.linkLoadsGbps[selectedCanonicalLink.id]??0):'—'",
              "analysisAuthoritative?pct(analysis.routing.linkUtilizationPct[selectedCanonicalLink.id]??0):'Not analyzed'": "currentAnalysisVisible?pct(analysis.routing.linkUtilizationPct[selectedCanonicalLink.id]??0):'Not analyzed'",
              "!analysisAuthoritative?'Not analyzed':selectedRoute?.reachable": "!currentAnalysisVisible?'Not analyzed':selectedRoute?.reachable",
          }
          for old, new in replacements.items():
              if old in text:
                  assert text.count(old) == 1, f'expected one occurrence of {old!r}, found {text.count(old)}'
                  text = text.replace(old, new, 1)
              else:
                  assert new in text, f'missing both old and new form: {old!r}'

          assert "currentAnalysisVisible&&analysis.result.violations.length>0" in text
          assert "currentAnalysisVisible?gbps" in text
          assert "currentAnalysisVisible?pct" in text
          assert "!currentAnalysisVisible?'Not analyzed':selectedRoute?.reachable" in text
          path.write_text(text, encoding='utf-8')
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/fix-current-evidence-guard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/workbench-m35d-stage6.tsx .github/workflows/fix-current-evidence-guard.yml
          git commit -m "fix: hide non-current analysis evidence"
          git push origin HEAD:ui-winning-level-hardening
