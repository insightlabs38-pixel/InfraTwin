name: Apply focused UI hardening fix

on:
  push:
    branches:
      - ui-winning-level-hardening

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and apply focused fix
        run: |
          set -euo pipefail
          git apply --check .ui-hardening-fix.patch
          git apply .ui-hardening-fix.patch
          rm .ui-hardening-fix.patch
          rm .github/workflows/apply-ui-hardening-fix.yml
          git add -A
          git diff --cached --check
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: close UI hardening qualification gaps'
          git push origin HEAD:${GITHUB_REF_NAME}
