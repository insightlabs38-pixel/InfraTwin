name: Level4A Unit Fix Executor

on:
  push:
    branches:
      - tmp/level4a-patch-loader
    paths:
      - '.github/workflows/level4a-patch-loader-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current Level 4A target
        uses: actions/checkout@v4
        with:
          ref: tmp/level-4a-adaptive-design
          fetch-depth: 0

      - name: Apply bounded unit fixes
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_TARGET="d75cbb62be51f6bf18aea3f71029b026317d6d19"
          ACTUAL_TARGET="$(git rev-parse HEAD)"
          if [ "$ACTUAL_TARGET" != "$EXPECTED_TARGET" ]; then
            echo "Refusing to apply: target moved from $EXPECTED_TARGET to $ACTUAL_TARGET" >&2
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          optimizer = Path('packages/optimizer/src/level4-design.ts')
          text = optimizer.read_text()
          old = "if(s.includes('infeasible')){if(r.lockedLinkIds.length||r.lockedNodeIds.length)return'LOCKS_REMOVE_ALL_FEASIBLE_ACTIONS' as const;if(r.budgetCostUnits!==null)return'BUDGET_INFEASIBLE' as const;return'SCENARIO_REQUIREMENTS_INFEASIBLE' as const}"
          new = "if(s.includes('infeasible')){if(r.budgetCostUnits!==null)return'BUDGET_INFEASIBLE' as const;if(r.lockedLinkIds.length||r.lockedNodeIds.length)return'LOCKS_REMOVE_ALL_FEASIBLE_ACTIONS' as const;return'SCENARIO_REQUIREMENTS_INFEASIBLE' as const}"
          if text.count(old) != 1:
              raise SystemExit('classification replacement did not match exactly once')
          optimizer.write_text(text.replace(old, new))

          test_file = Path('tests/level4a-adaptive-design.test.ts')
          text = test_file.read_text()
          replacements = [
              ("let plan=createChangePlan('level4a-app-plan','Level 4A shared plan')", "let plan=createChangePlan(project,'Level 4A shared plan',{id:'level4a-app-plan',now:'2026-08-29T00:00:00.000Z'})"),
              ("assert.ok(!plan.proposals.some(proposal=>proposal.change.target.kind==='link'&&proposal.change.target.id==='X'));", "assert.ok(!plan.proposals.some(proposal=>proposal.state==='pending'&&proposal.change.target.kind==='link'&&proposal.change.target.id==='X'));assert.ok(plan.proposals.some(proposal=>proposal.state==='pending'&&proposal.change.target.kind==='link'&&proposal.change.target.id==='Y'));"),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'test replacement did not match exactly once: {old}')
              text = text.replace(old, new)
          test_file.write_text(text)
          PY

          git diff --check
          git diff -- packages/optimizer/src/level4-design.ts tests/level4a-adaptive-design.test.ts

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - name: Run focused Level 4A unit suite
        run: node --experimental-strip-types --test tests/level4a-adaptive-design.test.ts

      - name: Commit and push bounded fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/optimizer/src/level4-design.ts tests/level4a-adaptive-design.test.ts
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m "fix(level4a): align infeasibility and replan contracts"
          git push origin HEAD:tmp/level-4a-adaptive-design
