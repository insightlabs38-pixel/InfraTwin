name: Align demo scene 10 capture assertion

on:
  push:
    branches:
      - demo-winning-level-capture

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align assertion with hardened workflow guidance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('e2e/demo/demo-scenes.spec.ts')
          text = path.read_text()
          old = "await expect(page.getByTestId('workflow-guidance')).toContainText(/stale/i);"
          new = "await expect(page.getByTestId('workflow-guidance')).toContainText(/analyze again/i);"
          if old not in text:
              raise SystemExit('Expected scene 10 assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY
          node --experimental-strip-types --check e2e/demo/demo-scenes.spec.ts
          git diff --check
      - name: Commit capture assertion repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/demo/demo-scenes.spec.ts
          git commit -m 'test: align stale-scene workflow guidance'
          git push origin HEAD:${GITHUB_REF_NAME}
