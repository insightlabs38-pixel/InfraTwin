name: Phase35C5 Patch Apply

on:
  push:
    branches:
      - tmp/phase-3-5c5-validation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply replay label type fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply replay label type fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/components/workbench.tsx')
          text = p.read_text()
          old = 'item.linkId ?? item.demandId ?? item.code'
          new = 'item.linkId ?? item.demandId ?? item.message'
          if old not in text:
              raise SystemExit('Expected replay label fragment not found')
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/workbench.tsx
          git diff --cached --check
          git commit -m "fix(phase-3.5c.5): apply replay label type fix"
          git push origin HEAD:tmp/phase-3-5c5-validation
