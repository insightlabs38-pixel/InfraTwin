name: Phase35C5 Patch Apply

on:
  push:
    branches:
      - tmp/phase-3-5c5-validation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply M3.5C.5 remainder fixes') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply M3.5C.5 remainder regression fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected source fragment not found in {path}")
              p.write_text(text.replace(old, new, 1))

          replace_once('apps/web/components/change-plan-panel.tsx', "item.actor === 'agent' ? 'Accepted optimizer proposal' : 'Human-authored'", "item.actor === 'agent' ? 'Agent/optimizer proposal accepted by human' : 'Human-authored'")
          old = base64.b64decode('').decode()
          new = base64.b64decode('').decode()
          replace_once('apps/web/components/workbench.tsx', old, new)
          replace_once('apps/web/app/phase35b.css', '.topology-pan-surface{fill:transparent}', '.topology-pan-surface{fill:transparent;pointer-events:none}')
          replace_once('apps/web/app/phase35c5.css', '.floating-notice { position: fixed; z-index: 95; left:', '.floating-notice { position: fixed; z-index: 95; pointer-events: none; left:')
          replace_once('e2e/phase35c-performance-scale.spec.ts', "  await expect(page.getByTestId('capacity-analysis-status')).toContainText(/COMPLETE/i, { timeout: 15_000 });\n  const profile = await page.getByTestId('compute-profile').innerText();", "  await expect(page.getByTestId('capacity-analysis-status')).toContainText(/COMPLETE/i, { timeout: 15_000 });\n  await page.getByTestId('advanced-toggle').click();\n  await expect(page.getByTestId('advanced-drawer')).toBeVisible();\n  const profile = await page.getByTestId('compute-profile').innerText();")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/change-plan-panel.tsx apps/web/components/workbench.tsx apps/web/app/phase35b.css apps/web/app/phase35c5.css e2e/phase35c-performance-scale.spec.ts
          git diff --cached --check
          git commit -m "fix(phase-3.5c.5): apply M3.5C.5 remainder fixes"
          git push origin HEAD:tmp/phase-3-5c5-validation
