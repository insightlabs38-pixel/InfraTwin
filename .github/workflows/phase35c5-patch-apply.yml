name: Phase35C5 Patch Apply

on:
  push:
    branches:
      - tmp/phase-3-5c5-validation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply visible SVG link target fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply visible SVG link target fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/components/topology-canvas.tsx')
          text = p.read_text()
          old_visible = '<line x1={source.x} y1={source.y} x2={target.x} y2={target.y} className={classes} style={{ strokeWidth: clamp(1.4 + utilization / 48 + (priority ? 1.5 : 0), 1.4, 7) }} vectorEffect="non-scaling-stroke" />'
          new_visible = '<line x1={source.x} y1={source.y} x2={target.x} y2={target.y} className={classes} data-testid={`topology-link-${link.id}`} style={{ strokeWidth: clamp(1.4 + utilization / 48 + (priority ? 1.5 : 0), 1.4, 7) }} vectorEffect="non-scaling-stroke" />'
          old_hit = '<line x1={source.x} y1={source.y} x2={target.x} y2={target.y} className="link-hit-target" data-testid={`topology-link-${link.id}`} vectorEffect="non-scaling-stroke" tabIndex={0} role="button"'
          new_hit = '<line x1={source.x} y1={source.y} x2={target.x} y2={target.y} className="link-hit-target" vectorEffect="non-scaling-stroke" tabIndex={0} role="button"'
          if old_visible not in text or old_hit not in text:
              raise SystemExit('Expected visible/hit link fragments not found')
          p.write_text(text.replace(old_visible, new_visible, 1).replace(old_hit, new_hit, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/topology-canvas.tsx
          git diff --cached --check
          git commit -m "fix(phase-3.5c.5): apply visible SVG link target fix"
          git push origin HEAD:tmp/phase-3-5c5-validation
