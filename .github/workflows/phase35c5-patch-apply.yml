name: Phase35C5 Patch Apply

on:
  push:
    branches:
      - tmp/phase-3-5c5-validation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply staged Phase 3.5C.5 UX patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply staged Phase 3.5C.5 patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH_B64="planning/.phase35c5-ux.gz.b64"
          if [[ ! -f "$PATCH_B64" ]]; then
            echo "No staged Phase 3.5C.5 patch present."
            exit 0
          fi
          base64 -d "$PATCH_B64" | gzip -d > /tmp/phase35c5.patch
          patch -p1 < /tmp/phase35c5.patch
          rm -f "$PATCH_B64"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Patch produced no changes."
            exit 0
          fi
          git commit -m "test(phase-3.5c.5): apply staged product UX implementation"
          git push origin HEAD:tmp/phase-3-5c5-validation
