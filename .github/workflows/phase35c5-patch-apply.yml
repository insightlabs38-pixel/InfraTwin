name: Phase35C5 Patch Apply

on:
  push:
    branches:
      - tmp/phase-3-5c5-validation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply badge hit-through fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply badge hit-through fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          css = Path('apps/web/app/phase35b.css')
          text = css.read_text()
          old = '.state-badge{fill:#f2c482;font-size:8px;font-weight:950;text-anchor:middle;paint-order:stroke;stroke:#090f17;stroke-width:3px}'
          new = '.state-badge{fill:#f2c482;font-size:8px;font-weight:950;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#090f17;stroke-width:3px}'
          if old not in text:
              raise SystemExit('Expected state badge CSS not found')
          css.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/phase35b.css
          git diff --cached --check
          git commit -m "fix(phase-3.5c.5): apply badge hit-through fix"
          git push origin HEAD:tmp/phase-3-5c5-validation
