name: Phase35C Patch Apply

on:
  push:
    branches:
      - tmp/phase35c-patch-apply

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply staged Phase 3.5C source patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply staged patch when all chunks are present
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          PARTS=(planning/.phase35c-patch.part*)
          if [[ ${#PARTS[@]} -ne 6 ]]; then
            echo "Waiting for all 6 staged patch chunks; found ${#PARTS[@]}."
            exit 0
          fi
          cat "${PARTS[@]}" | base64 -d | gzip -d > /tmp/phase35c.patch
          patch -p1 < /tmp/phase35c.patch
          rm -f "${PARTS[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Patch produced no changes."
            exit 0
          fi
          git commit -m "feat(phase-3.5c): apply staged Phase 3.5C source patch"
          git push origin HEAD:tmp/phase35c-patch-apply
