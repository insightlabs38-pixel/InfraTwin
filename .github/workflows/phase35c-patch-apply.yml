name: Phase35C Patch Apply

on:
  push:
    branches:
      - tmp/phase35c-patch-apply

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply staged Phase 3.5C source patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply staged patch when present
        shell: bash
        run: |
          set -euo pipefail
          PATCH_B64="planning/.phase35c-fixes.gz.b64"
          if [[ ! -f "$PATCH_B64" ]]; then
            echo "No staged fixes patch present."
            exit 0
          fi
          base64 -d "$PATCH_B64" | gzip -d > /tmp/phase35c.patch
          patch -p4 < /tmp/phase35c.patch
          rm -f "$PATCH_B64"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Patch produced no changes."
            exit 0
          fi
          git commit -m "fix(phase-3.5c): enforce measured browser N-1 envelope"
          git push origin HEAD:tmp/phase35c-patch-apply
