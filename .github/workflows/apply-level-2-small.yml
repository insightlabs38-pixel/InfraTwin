name: Apply Level 2 exact bundle

on:
  push:
    branches:
      - feature/level-2-resilience-engine

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify and apply exact Level 2 bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .github/level2_bundle_final/part{00..07} > /tmp/level2.b64
          echo "e75819211952c3c1dccbdeaa84b5cd540b252b0fd6a93ab02a5007ee34108ae5  /tmp/level2.b64" | sha256sum -c -
          base64 --decode /tmp/level2.b64 > /tmp/level2.tar.gz
          echo "1576787f218f43775938b105ba3bbc62a6498a57ff2f370c5c8c9789b2d90a46  /tmp/level2.tar.gz" | sha256sum -c -
          tar -xzf /tmp/level2.tar.gz -C .

          for path in \
            .github/workflows/ci.yml \
            README.md \
            package.json \
            apps/web/app/globals.css \
            apps/web/components/workbench.tsx \
            apps/web/workers/contingency.worker.ts \
            benchmarks/level2-medium.ts \
            packages/evidence/src/index.ts \
            packages/graph-engine/src/index.ts \
            packages/model/network-model.schema.json \
            packages/model/src/index.ts \
            packages/scenarios/src/index.ts \
            packages/webmcp/src/index.ts \
            planning/LEVEL2_IMPLEMENTATION_STATUS.md \
            planning/LEVEL2_BENCHMARK.md \
            tests/level2.test.ts; do
            test -f "$path"
          done

          rm -rf .github/level2_bundle_final .github/level2_bundle
          rm -f .github/level2-trigger.txt .github/level2-trigger-2.txt
          rm -f .github/workflows/apply-level-2.yml .github/workflows/apply-level-2-small.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat(level-2): add worker-parallel resilience engine' -m 'Complete the Level 2 planning gate with deterministic ECMP, bounded N-1 worker/fallback execution, progress and cancellation, stale-result protection, counterexample replay, min-cut evidence, dynamic WebMCP capability groups, browser safety bounds, benchmarks, and Level 2 evaluation coverage.'
          git push origin HEAD:feature/level-2-resilience-engine
