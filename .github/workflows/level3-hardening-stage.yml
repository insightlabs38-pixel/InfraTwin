name: Level 3 hardening stage

on:
  push:
    branches:
      - feature/level-3-hardening

permissions:
  contents: write

jobs:
  harden-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply staged Level 3 hardening transforms
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/level3-hardening-core.py
          python3 scripts/level3-hardening-ui.py

      - name: Wire Playwright, strict includes, CI gate, docs, and ignores
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['scripts']['test:e2e'] = 'playwright test'
          package.setdefault('devDependencies', {})['@playwright/test'] = '1.62.1'
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          tsconfig_path = Path('tsconfig.json')
          tsconfig = json.loads(tsconfig_path.read_text())
          include = tsconfig.setdefault('include', [])
          for path in ['e2e/**/*.ts', 'playwright.config.ts']:
              if path not in include:
                  include.append(path)
          tsconfig_path.write_text(json.dumps(tsconfig, indent=2) + '\n')

          ci = '''name: CI

          on:
            push:
            pull_request:

          jobs:
            quality-gate:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - run: npm ci
                - run: npx playwright install --with-deps chromium
                - run: npm test
                - run: npm run typecheck
                - run: npm run build
                - run: npm run test:e2e
                - run: npm run benchmark:level2
                - run: npm run benchmark:level3
          '''
          import textwrap
          Path('.github/workflows/ci.yml').write_text(textwrap.dedent(ci))

          gitignore_path = Path('.gitignore')
          gitignore = gitignore_path.read_text()
          for entry in ['playwright-report/', 'test-results/']:
              if entry not in gitignore:
                  gitignore += entry + '\n'
          gitignore_path.write_text(gitignore)

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          heading = '## Level 3 hardening\n'
          if heading not in readme:
              readme += '''

          ## Level 3 hardening

          The current Level 0–3 product is frozen for a reliability and judge-facing product-quality pass before any Level 4 work. The workbench now separates the primary engineering journey from advanced protocol/solver diagnostics, routes human semantic edits through validated `ModelCommand` application, and uses a semantic SHA-256 model identity that excludes layout-only node coordinates and presentation metadata.

          WebMCP analysis contracts are state-honest: `simulate_change` is read-only, N-1 ranking does not silently replay a failure, and `show_counterexample` is only registered when a valid ranking exists. Model-derived tool output is marked as untrusted content where imported/user-controlled labels may be present.

          Browser regression coverage is available with `npm run test:e2e` and covers the bundled Maintenance Trap, Growth Wall, and Resilience Gap workflows plus cancellation, reset/switch stale-result protection, import/export, HiGHS worker loading, and responsive-layout smoke checks.

          See `planning/LEVEL3_HARDENING_STATUS.md` for the exact hardening scope and remaining limitations. The next stage after this gate is a dedicated adversarial/fuzz/evaluation pass; this hardening pass does not claim that adversarial testing is complete.
          '''
              readme = textwrap.dedent(readme)
          readme_path.write_text(readme)
          PY

      - name: Synchronize npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Clean install
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for browser safety gate
        run: npx playwright install --with-deps chromium

      - name: Existing and hardening unit tests
        run: npm test

      - name: Strict TypeScript
        run: npm run typecheck

      - name: Production Next build
        run: npm run build

      - name: Browser E2E safety net
        run: npm run test:e2e

      - name: Level 2 benchmark
        run: npm run benchmark:level2

      - name: Level 3 benchmark
        run: npm run benchmark:level3

      - name: Commit validated hardening result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .gitignore \
            .github/workflows/ci.yml \
            README.md \
            package.json \
            package-lock.json \
            tsconfig.json \
            packages/model/src/index.ts \
            packages/webmcp/src/index.ts \
            tests/level1.test.ts \
            tests/level2.test.ts \
            apps/web/components/workbench.tsx \
            apps/web/app/globals.css
          git diff --cached --quiet && exit 0
          git commit -m 'feat(level-3): harden product, provenance, WebMCP, and browser safety' -m 'Freeze Level 0–3 behavior while improving the decision workflow, routing human edits through ModelCommand, adopting semantic SHA-256 provenance, correcting read-only and state-derived WebMCP capabilities, adding stale publication guards, integrating Playwright browser coverage, and extending the full CI/benchmark gate.'
          git push origin HEAD:feature/level-3-hardening
