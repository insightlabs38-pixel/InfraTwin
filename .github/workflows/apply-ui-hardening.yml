name: Apply UI hardening payload

on:
  push:
    branches:
      - ui-winning-level-hardening

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and validate patch
        run: |
          set -euo pipefail
          : > /tmp/ui-hardening.patch.gz
          cat .ui-hardening/chunk-00 >> /tmp/ui-hardening.patch.gz
          cat .ui-hardening/part-01-0 .ui-hardening/part-01-1 .ui-hardening/part-01-2 .ui-hardening/part-01-3 >> /tmp/ui-hardening.patch.gz
          cat .ui-hardening/chunk-02 .ui-hardening/chunk-03 .ui-hardening/chunk-04 >> /tmp/ui-hardening.patch.gz
          cat .ui-hardening/part-05-0 .ui-hardening/part-05-1 .ui-hardening/part-05-2 .ui-hardening/part-05-3 >> /tmp/ui-hardening.patch.gz
          cat .ui-hardening/chunk-06 .ui-hardening/chunk-07 .ui-hardening/chunk-08 >> /tmp/ui-hardening.patch.gz
          test "$(sha256sum /tmp/ui-hardening.patch.gz | awk '{print $1}')" = "9efe49dc3220d754e7571e26accbdfde8b1c767499e65fded16a1557bcbcbca2"
          gzip -t /tmp/ui-hardening.patch.gz
          gunzip -c /tmp/ui-hardening.patch.gz > /tmp/ui-hardening.patch
          git apply --check /tmp/ui-hardening.patch
      - name: Apply hardening patch
        run: |
          set -euo pipefail
          git apply /tmp/ui-hardening.patch
          rm -rf .ui-hardening
          rm -f .github/workflows/apply-ui-hardening.yml
          git add -A
          git diff --cached --check
      - name: Commit hardened frontend
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: winning-level UI hardening'
          git push origin HEAD:${GITHUB_REF_NAME}
