name: Apply Level 2 bundle

on:
  push:
    branches:
      - feature/level-2-resilience-engine

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact locally-tested Level 2 bundle
        shell: bash
        run: |
          cat > /tmp/level2.b64 <<'PAYLOAD'




PAYLOAD
          base64 --decode /tmp/level2.b64 > /tmp/level2.tar.gz
          tar -xzf /tmp/level2.tar.gz -C .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml README.md package.json apps/web/app/globals.css apps/web/components/workbench.tsx apps/web/workers/contingency.worker.ts benchmarks/level2-medium.ts packages/evidence/src/index.ts packages/graph-engine/src/index.ts packages/model/network-model.schema.json packages/model/src/index.ts packages/scenarios/src/index.ts packages/webmcp/src/index.ts planning/LEVEL2_IMPLEMENTATION_STATUS.md planning/LEVEL2_BENCHMARK.md tests/level2.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'feat(level-2): add worker-parallel resilience engine'
          git push origin HEAD:feature/level-2-resilience-engine
