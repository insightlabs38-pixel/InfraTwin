name: Level 3 adversarial stage

on:
  push:
    branches:
      - feature/level-3-adversarial

permissions:
  contents: write

jobs:
  apply-confirmed-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply confirmed adversarial fixes
        run: python3 scripts/level3-adversarial-fixes.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run focused unit gate
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/graph-engine/src/index.ts \
            packages/model/src/index.ts \
            packages/model/network-model.schema.json \
            packages/optimizer/src/index.ts \
            packages/webmcp/src/index.ts \
            apps/web/components/workbench.tsx \
            tests/level3-adversarial-findings.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(level-3): correct adversarially confirmed semantics'
          git push origin HEAD:feature/level-3-adversarial
