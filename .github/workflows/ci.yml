name: CI

on:
  push:
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: phase35c-source-snapshot
          path: |
            .github
            apps
            benchmarks
            e2e
            packages
            planning
            scripts
            tests
            package.json
            package-lock.json
            playwright.config.ts
            playwright.scale.config.ts
            tsconfig.json
          retention-days: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:e2e
      - name: Upload browser inspection artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: level3-browser-inspection
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run benchmark:level2
      - run: npm run benchmark:level3
      - name: Reset scale benchmark output
        run: rm -rf benchmark-results && mkdir -p benchmark-results
      - run: npm run benchmark:scale
      - name: Upload scale benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase35c-scale-benchmark
          path: benchmark-results/*.json
          if-no-files-found: ignore
          retention-days: 14
