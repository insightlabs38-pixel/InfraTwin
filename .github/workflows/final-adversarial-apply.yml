name: Final Adversarial Apply

on:
  push:
    branches: [final/adversarial-validation]
    paths:
      - scripts/final-adversarial-cancellation-test-fix.py
      - .github/workflows/final-adversarial-apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final/adversarial-validation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/final-adversarial-cancellation-test-fix.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run typecheck
      - run: npx playwright test e2e/level3-adversarial.spec.ts --grep "cancellation records cancellation" --workers=1
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/level3-adversarial.spec.ts
          git diff --cached --quiet || git commit -m "test(final): make cancellation race deterministic"
          git push origin HEAD:final/adversarial-validation
