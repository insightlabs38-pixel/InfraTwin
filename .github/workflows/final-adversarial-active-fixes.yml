name: Final Adversarial Active Fixes

on:
  push:
    branches: [final/adversarial-validation]
    paths:
      - scripts/final-adversarial-active-fixes.py
      - .github/workflows/final-adversarial-active-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final/adversarial-validation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/final-adversarial-active-fixes.py
      - run: npm ci
      - run: node --experimental-strip-types --test tests/final-adversarial-webmcp-inputs.test.ts tests/final-adversarial-solver-truth.test.ts tests/phase35d-webmcp-coactivity.test.ts tests/final-adversarial-scale-actions.test.ts tests/phase35a-change-plan.test.ts tests/final-adversarial.test.ts
      - run: npm run typecheck
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/webmcp/src/m35d.ts packages/model/src/index.ts packages/optimizer/src/index.ts tests/final-adversarial-webmcp-inputs.test.ts tests/final-adversarial-scale-actions.test.ts tests/final-adversarial-solver-truth.test.ts
          git diff --cached --quiet || git commit -m "fix(final): harden solver, WebMCP, and repeated-action boundaries"
          git push origin HEAD:final/adversarial-validation
