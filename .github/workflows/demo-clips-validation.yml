name: TEMP validate InfraTwin demo clips

on:
  push:
    branches:
      - demo/final-demo-clips

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      CAPTURE_SET: all
      KEEP_RAW_WEBM: 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify ffmpeg
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Frozen quality gate
        run: |
          npm test
          npm run typecheck
          npm run build
      - name: Capture
        run: xvfb-run -a npx playwright test --config=playwright.demo.config.ts
      - name: Process
        run: node scripts/process-demo-clips.mjs
      - name: Validate
        run: node scripts/validate-demo-clips.mjs
      - name: Manifest
        run: node scripts/generate-demo-manifest.mjs
      - name: Upload footage
        uses: actions/upload-artifact@v4
        with:
          name: infratwin-demo-clips
          retention-days: 10
          if-no-files-found: error
          path: |
            demo-clips/
            raw/
            contact-sheets/
            capture-manifest.json
            capture-manifest.md
            demo-preview.mp4
            planning/DEMO_CLIP_REVIEW.md
      - name: Upload debug on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: infratwin-demo-capture-debug
          retention-days: 7
          if-no-files-found: ignore
          path: |
            demo-test-results/
            raw/
