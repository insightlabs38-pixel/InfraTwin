name: Level4B Finalize

on:
  push:
    branches: [feature/level-4b-high-scale-design]
    paths:
      - scripts/level4b-finalize.py
      - .github/workflows/level4b-finalize.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[level4b-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/level-4b-high-scale-design
          fetch-depth: 0
      - run: python scripts/level4b-finalize.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Commit generated final integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/optimizer/src/level4-design.ts apps/web/components/workbench-m35d-stage3.tsx tests/level4b-path-engine.test.ts
          git diff --cached --exit-code && exit 0
          git commit -m "feat(level4b): add adaptive progress and Pareto reuse gates [level4b-finalized]"
          git push origin HEAD:feature/level-4b-high-scale-design
