name: Final submission polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact final replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          helper = Path('.github/workflows/final-submission-polish.yml')
          replacements = [
              (
                  Path('README.md'),
                  'https://infra-twin-web-pi.vercel.app',
                  'https://web-mauve-three-58.vercel.app/',
              ),
              (
                  Path('apps/web/components/workbench-m35d-network-view.tsx'),
                  '<span>Shared workspace</span><strong>{collaborationNotice || \'Human + agent share this ChangePlan\'}</strong>',
                  '<span>Shared workspace</span>{\' \'}<strong>{collaborationNotice || \'Human + agent share this ChangePlan\'}</strong>',
              ),
              (
                  Path('apps/web/components/workbench-m35d-stage6.tsx'),
                  '<span className="section-kicker">{ephemeralPatch ? \'Counterexample replay\' : \'Plan result\'}</span><strong data-testid="verdict">',
                  '<span className="section-kicker">{ephemeralPatch ? \'Counterexample replay\' : \'Plan result\'}</span>{\' \'}<strong data-testid="verdict">',
              ),
          ]

          for path, old, new in replacements:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print(f'updated {path}')

          # Guard the URL migration while excluding this temporary workflow,
          # which necessarily contains the old URL as the replacement target.
          stale_paths = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p == helper or p.stat().st_size >= 2_000_000:
                  continue
              if 'infra-twin-web-pi.vercel.app' in p.read_text(encoding='utf-8', errors='ignore'):
                  stale_paths.append(str(p))
          if stale_paths:
              raise SystemExit(f'old Vercel URL still present in: {stale_paths}')
          PY
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Commit permanent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md apps/web/components/workbench-m35d-network-view.tsx apps/web/components/workbench-m35d-stage6.tsx
          git diff --cached --check
          git commit -m "chore: finalize submission links and network spacing"
          git push origin HEAD:main
