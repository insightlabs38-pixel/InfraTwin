name: Repair winning demo scene choreography

on:
  push:
    branches:
      - demo-winning-level-capture

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply capture-only repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          spec = Path('e2e/demo/demo-scenes.spec.ts')
          text = spec.read_text()
          text = text.replace("  seedFlagshipProposal,\n  waitForNativeTools,", "  seedFlagshipProposal,\n  selectLink,\n  waitForNativeTools,")
          text = text.replace("toContainText(/outage|unavailable/i)", "toContainText(/offline/i)")
          text = text.replace("await clickTopologyLink(page, proposalLinkId);", "await selectLink(page, proposalLinkId);")
          text = text.replace("toContainText('1,200')", "toContainText('1200')")
          spec.write_text(text)

          helper = Path('e2e/demo/demo-helpers.ts')
          text = helper.read_text().replace("/stale after plan revision/i", "/Stale · needs replanning/i")
          helper.write_text(text)
          PY
          node --experimental-strip-types --check e2e/demo/demo-scenes.spec.ts
          node --experimental-strip-types --check e2e/demo/demo-helpers.ts
          git diff --check
      - name: Commit capture-only repairs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/demo/demo-scenes.spec.ts e2e/demo/demo-helpers.ts
          git commit -m 'test: repair winning demo scene choreography'
          git push origin HEAD:${GITHUB_REF_NAME}
